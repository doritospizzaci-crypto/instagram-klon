name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Proje dosyalarini olustur
        run: |
          mkdir -p /tmp/keep
          cp app.dart firebase_options.dart /tmp/keep/
          flutter create . --org com.example --project-name instagram_klon --platforms=android
          cp /tmp/keep/app.dart lib/main.dart
          cp /tmp/keep/firebase_options.dart lib/firebase_options.dart
          flutter pub add firebase_core firebase_auth cloud_firestore image_picker

      - name: APK derle
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
